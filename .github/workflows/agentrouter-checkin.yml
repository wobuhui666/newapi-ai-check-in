name: AgentRouter 每日签到

on:
  schedule:
    - cron: "10 1 * * *"   # 每天北京时间 09:10
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: agentrouter
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 Playwright
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: 签到
        env:
          AGENTROUTER_EMAIL: ${{ secrets.AGENTROUTER_EMAIL }}
          AGENTROUTER_PASSWORD: ${{ secrets.AGENTROUTER_PASSWORD }}
        run: python agentrouter/checkin.py
      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agentrouter-failure-screenshot
          path: failure.png
          if-no-files-found: ignore
          retention-days: 7
